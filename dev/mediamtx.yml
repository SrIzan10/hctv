paths:
  all:
    source: publisher

srt: yes
srtAddress: :8890

hls: yes
hlsAlwaysRemux: yes
hlsVariant: lowLatency
hlsSegmentDuration: 1s
hlsSegmentCount: 15
hlsPartDuration: 1s
hlsAllowOrigins: ['http://localhost:3000']

webrtc: yes

rtmp: yes
rtmpAddress: :1935

authMethod: http
authHTTPAddress: http://host.docker.internal:3000/api/mediamtx/publish?region=hq

api: yes
# MediaMTX 1.21 stopped excluding `metrics` from HTTP auth by default, which made
# it ask the web app to authorize its own scrape and get a 401 back. Port 9998 is
# never published to the host: HQ is reachable only on the compose network, and
# mirrors sit behind Traefik basic auth. `api` and `pprof` deliberately stay on
# the webhook, where the API key is checked and pprof is denied.
authHTTPExclude:
  - action: metrics

metrics: yes
metricsAddress: :9998
