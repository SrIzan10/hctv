global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: web
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - host.docker.internal:3000

  - job_name: chat
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000

  # Dev runs a single MediaMTX; it stands in for the hq region. Uncomment the
  # mediamtx2 service in dev/docker-compose.yml and the block below to exercise
  # the multi-region panels locally.
  - job_name: mediamtx
    metrics_path: /metrics
    static_configs:
      - targets:
          - mediamtx:9998
        labels:
          region: hq
      # - targets:
      #     - mediamtx2:9998
      #   labels:
      #     region: ethande

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
